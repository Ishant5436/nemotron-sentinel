[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-sentinel"
version = "1.0.0"
description = "Autonomous Deterministic Developer Safety & Verification Agent powered by NVIDIA Nemotron & Nebius Token Factory"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ishant5436", email = "ishant.p@somaiya.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp==1.29.1",
    "pydantic>=2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
nemotron-sentinel = "nemotron_sentinel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
